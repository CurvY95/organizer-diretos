# Tema comercial. A cor de destaque em runtime pode ser sobrescrita por
# st.secrets / env: BRAND_PRIMARY. Coloca o logo em assets/logo.png ou BRAND_LOGO_PATH.
[theme]
base = "light"
primaryColor = "#16803c"
backgroundColor = "#f4f6f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#111312"
font = "sans serif"
